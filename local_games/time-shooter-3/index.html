<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Shooter 3: SWAT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: Arial, sans-serif; font-size: 18px; z-index: 10; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="loader" id="loader">Loading Time Shooter 3...</div>
  <iframe id="game" src="https://html5.gamedistribution.com/6493b872f0564380a7adad671d1e0a57/" 
    allow="fullscreen; autoplay; gamepad; pointer-lock" 
    referrerpolicy="no-referrer" allowfullscreen
    onload="document.getElementById('loader').style.display='none'"></iframe>
</body>
</html>
